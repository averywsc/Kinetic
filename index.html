<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinetic — Satisfying Physics Runner</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%230b0e14'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='10.5'%20fill='none'%20stroke='%2326d9a8'%20stroke-width='2.2'%20stroke-dasharray='48%2018'/%3E%3Ccircle%20cx='19.5'%20cy='12.5'%20r='3.6'%20fill='%23eef3ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* ==========================================================================
   Kinetic — Clean, Divider-Free Studio Interface
   ========================================================================== */
:root {
  --bg: #07090d;
  --panel: rgba(15, 18, 25, 0.84);
  --surface: rgba(255, 255, 255, 0.06);
  --surface-hover: rgba(255, 255, 255, 0.12);
  --ring: rgba(255, 255, 255, 0.08);
  --text: #eef2f9;
  --muted: #8f9bb2;
  --accent: #26d9a8;
  --danger: #ff4d63;
  --ease: cubic-bezier(0.2, 0.9, 0.25, 1);
  --font: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 500 14px/1.4 var(--font); -webkit-font-smoothing: antialiased;
  overflow: hidden; touch-action: none;
  user-select: none; -webkit-user-select: none;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- Stage & 9:16 Reels Frame ---------- */
#stage {
  position: fixed; inset: 0; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 42%, #111520 0%, #05070b 78%);
  transition: padding 0.45s var(--ease);
}
#frame {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  background: #090b10;
  transition: width 0.45s var(--ease), height 0.45s var(--ease), border-radius 0.45s var(--ease), box-shadow 0.45s var(--ease);
}
body.reels #stage { padding: 66px 16px 76px; }
body.reels #frame {
  width: min(calc((100dvh - 142px) * 9 / 16), calc(100vw - 32px));
  height: min(calc(100dvh - 142px), calc((100vw - 32px) * 16 / 9));
  border-radius: 22px;
  box-shadow: 0 36px 90px -20px rgba(0, 0, 0, 0.92), 0 0 0 1px rgba(255, 255, 255, 0.1);
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

#prog {
  position: absolute; left: 0; right: 0; top: 0; height: 2px;
  pointer-events: none; background: rgba(255, 255, 255, 0.05);
  opacity: 0; transition: opacity 0.3s;
}
body.autorun #prog { opacity: 1; }
#prog i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width 0.12s linear; }

/* ---------- Top Bar ---------- */
.topbar {
  position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px;
  z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  pointer-events: none;
  transition: opacity 0.45s, transform 0.45s var(--ease);
}
.topbar > * { pointer-events: auto; }
body.hide .topbar { opacity: 0; transform: translateY(-12px); pointer-events: none; }

.mode-btn {
  display: flex; align-items: center; gap: 10px;
  height: 40px; padding: 0 14px 0 13px; border-radius: 12px; border: 0;
  background: var(--panel);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.78);
  transition: background 0.2s, transform 0.2s;
}
.mode-btn:hover { background: rgba(25, 29, 40, 0.92); }
.mode-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.mode-name { font-weight: 600; font-size: 0.92rem; letter-spacing: -0.015em; }
.mode-idx {
  font-size: 0.76rem; font-weight: 500; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.mode-btn svg { width: 15px; height: 15px; color: var(--muted); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.right-bar { display: flex; align-items: center; gap: 6px; }
.telemetry {
  height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px;
  background: var(--panel);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  font-size: 0.82rem; font-weight: 500; color: #d4dced; font-variant-numeric: tabular-nums;
}
.rec-badge {
  height: 40px; display: flex; align-items: center; gap: 7px; padding: 0 13px; border-radius: 12px; border: 0;
  background: rgba(165, 24, 44, 0.82); color: #fff;
  font-size: 0.8rem; font-weight: 600; font-variant-numeric: tabular-nums;
}
.rec-badge i { width: 7px; height: 7px; border-radius: 50%; background: #ff5b70; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

.sq-btn {
  height: 40px; min-width: 40px; padding: 0 12px; border-radius: 12px; border: 0;
  background: var(--panel); color: #d5def0;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 0.82rem; font-weight: 600;
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  transition: background 0.2s, color 0.2s;
}
.sq-btn:hover { background: rgba(26, 31, 44, 0.92); color: #fff; }
.sq-btn[aria-pressed="true"] { background: #eef2f9; color: #090b10; }
.sq-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Compact Transport Bar (Bottom-Center, Zero Dividers) ---------- */
.transport {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); z-index: 5;
  display: flex; align-items: center; gap: 4px; padding: 5px;
  border-radius: 14px; background: var(--panel);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: 0 16px 40px -14px rgba(0, 0, 0, 0.85);
  transition: opacity 0.45s, transform 0.45s var(--ease);
}
body.idle .transport { opacity: 0.26; }
.transport:hover, .transport:focus-within { opacity: 1 !important; }
body.hide .transport { opacity: 0; transform: translate(-50%, 140%); pointer-events: none; }

.tbtn {
  width: 38px; height: 36px; border: 0; border-radius: 10px;
  background: transparent; color: #d6dff0; display: grid; place-items: center;
  transition: background 0.2s, color 0.2s, transform 0.15s;
}
.tbtn:hover { background: var(--surface-hover); color: #fff; }
.tbtn:active { transform: scale(0.94); }
.tbtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tbtn.rec[aria-pressed="true"] { background: rgba(255, 77, 99, 0.22); color: var(--danger); }
.tbtn .off { opacity: 0; transition: opacity 0.2s; }
.tbtn[aria-pressed="false"] .off { opacity: 1; }
#playBtn .pl { display: none; }
#playBtn[aria-pressed="true"] .pl { display: block; }
#playBtn[aria-pressed="true"] .pa { display: none; }

/* ---------- Subtle Whisper Toast (Bottom-Left) ---------- */
#toast {
  position: fixed; left: 18px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  z-index: 4; pointer-events: none; max-width: 290px;
  padding: 11px 15px; border-radius: 13px;
  background: rgba(14, 17, 24, 0.84);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  opacity: 0; transform: translateY(10px);
  transition: opacity 0.35s, transform 0.4s var(--ease);
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast strong { display: block; font-size: 0.88rem; font-weight: 600; color: #fff; }
#toast span { display: block; margin-top: 2px; font-size: 0.78rem; color: var(--muted); line-height: 1.35; }

/* ---------- Right Slide-Over Settings Drawer (Divider-Free) ---------- */
.drawer {
  position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(326px, calc(100vw - 24px));
  z-index: 7; border-radius: 18px; overflow-y: auto; padding: 18px 18px 22px;
  background: rgba(13, 16, 23, 0.94);
  -webkit-backdrop-filter: blur(26px); backdrop-filter: blur(26px);
  box-shadow: -12px 24px 64px rgba(0, 0, 0, 0.84);
  transform: translateX(calc(100% + 28px));
  transition: transform 0.42s var(--ease);
  touch-action: pan-y;
  display: flex; flex-direction: column; gap: 20px;
}
body.drawer-open .drawer { transform: translateX(0); }

.dhead { display: flex; align-items: center; justify-content: space-between; }
.dhead h3 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: -0.02em; }
.dsec { padding: 0; }
.dlab {
  display: block; margin-bottom: 9px;
  font-size: 0.8rem; font-weight: 500; color: var(--muted);
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
#melGrid { max-height: 118px; overflow-y: auto; padding-right: 4px; }
.chip {
  border: 0; padding: 7px 11px; border-radius: 9px;
  background: var(--surface); color: #d5def0; font-size: 0.8rem; font-weight: 500;
  transition: background 0.18s, color 0.18s;
}
.chip:hover { background: var(--surface-hover); color: #fff; }
.chip[aria-pressed="true"] { background: #eef2f9; color: #090b10; font-weight: 600; }

.palgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.palchip {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 9px; border: 0;
  background: var(--surface); text-align: left;
  transition: background 0.2s, box-shadow 0.2s;
}
.palchip:hover { background: var(--surface-hover); }
.palchip[aria-pressed="true"] { background: rgba(255, 255, 255, 0.14); box-shadow: inset 0 0 0 1.5px #eef2f9; }
.swatch { width: 22px; height: 12px; border-radius: 4px; flex: none; }
.pname { font-size: 0.78rem; color: #dfe6f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sliders { display: grid; gap: 11px; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-size: 0.8rem; color: #d2dbee; }
.srow output { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.srow input[type=range] {
  -webkit-appearance: none; appearance: none; grid-column: 1 / -1;
  width: 100%; height: 20px; margin: 0; background: none;
}
.srow input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); }
.srow input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); }
.srow input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
}
.srow input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: #fff; }

.actgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
.actbtn {
  border: 0; padding: 9px 10px; border-radius: 10px;
  background: var(--surface); color: #eef2f9; font-size: 0.8rem; font-weight: 600;
  transition: background 0.2s, color 0.2s;
}
.actbtn:hover { background: var(--surface-hover); }
.actbtn[aria-pressed="true"] { background: #eef2f9; color: #090b10; }
.actbtn.danger { background: rgba(255, 77, 99, 0.16); color: #ff9aa6; }
.actbtn.danger[aria-pressed="true"] { background: var(--danger); color: #fff; }
.actbtn.full { grid-column: 1 / -1; background: rgba(255, 255, 255, 0.045); color: #b8c3d9; }
.actbtn.full:hover { background: var(--surface-hover); color: #fff; }

/* ---------- Categorized Live Preview Catalog Modal ---------- */
#catalog {
  position: fixed; inset: 0; z-index: 9; overflow-y: auto; touch-action: pan-y;
  padding: calc(22px + env(safe-area-inset-top, 0px)) 22px 38px;
  background: rgba(6, 8, 13, 0.93);
  -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
}
.cat-wrap { max-width: 1180px; margin: 0 auto; }
.cat-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
.cat-head h2 { margin: 0; font-size: 1.35rem; font-weight: 600; letter-spacing: -0.025em; }
.cat-head p { margin: 3px 0 0; font-size: 0.86rem; color: var(--muted); }
.cat-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.ctab {
  border: 0; padding: 8px 14px; border-radius: 10px;
  background: var(--surface); color: #cbd4e6; font-size: 0.82rem; font-weight: 600;
  transition: background 0.2s, color 0.2s;
}
.ctab:hover { background: var(--surface-hover); color: #fff; }
.ctab[aria-pressed="true"] { background: #eef2f9; color: #090b10; }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 13px; }
.tile {
  position: relative; padding: 0; border: 0; border-radius: 14px;
  overflow: hidden; background: #090b10; aspect-ratio: 10 / 7; text-align: left;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  transition: transform 0.28s var(--ease), box-shadow 0.25s;
}
.tile:hover { transform: translateY(-3px); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35), 0 18px 40px -16px rgba(0, 0, 0, 0.9); }
.tile[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
.tile canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tmeta {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 12px 10px;
  background: linear-gradient(transparent, rgba(5, 7, 11, 0.9) 58%);
}
.tmeta b { display: block; font-size: 0.88rem; font-weight: 600; color: #fff; }
.tmeta span { display: block; margin-top: 2px; font-size: 0.74rem; color: rgba(220, 230, 248, 0.74); line-height: 1.28; }

/* ---------- Export Modal ---------- */
#modal {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  background: rgba(5, 7, 11, 0.86); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
#modal .mbox { max-width: min(92vw, 820px); display: grid; gap: 12px; justify-items: center; padding: 18px; }
#modal img, #modal video { max-width: 100%; max-height: 70vh; border-radius: 14px; }
#modal a { padding: 10px 20px; border-radius: 10px; background: #eef2f9; color: #090b10; font-weight: 600; text-decoration: none; font-size: 0.86rem; }
#modal p { margin: 0; color: var(--muted); font-size: 0.82rem; }

@media (max-width: 680px) {
  .telemetry { display: none; }
  .sq-btn span { display: none; }
  #toast { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div id="stage">
  <div id="frame">
    <canvas id="cv" aria-label="Interactive satisfying physics simulation"></canvas>
    <div id="prog"><i id="progf"></i></div>
  </div>
</div>

<!-- Minimal Top Bar -->
<div class="topbar">
  <button class="mode-btn" id="modeBtn" type="button" title="Browse all 35 simulations (G)">
    <span class="mode-dot" id="modeDot"></span>
    <span class="mode-name" id="curName">Freeze &amp; Escape</span>
    <span class="mode-idx" id="curIdx">1 / 35</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>

  <div class="right-bar">
    <button class="rec-badge" id="recBadge" type="button" hidden title="Stop recording"><i></i><span id="recTime">00:00</span></button>
    <div class="telemetry" id="stxt">Ready</div>
    <button class="sq-btn" id="reelsTop" type="button" aria-pressed="false" title="9:16 Vertical Stage (V)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="3" width="11" height="18" rx="2"/><path d="M10.5 18h3"/></svg>
      <span>9:16</span>
    </button>
    <button class="sq-btn" id="autoTop" type="button" aria-pressed="false" title="Auto-Compile Reel (A)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>
      <span>Auto</span>
    </button>
    <button class="sq-btn" id="ctrlTop" type="button" aria-pressed="false" title="Settings (C)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span>Settings</span>
    </button>
  </div>
</div>

<!-- Compact Bottom Transport (No Divider Lines) -->
<div class="transport" id="transport">
  <button class="tbtn" id="prevBtn" type="button" aria-label="Previous simulation" title="Previous (←)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <button class="tbtn" id="playBtn" type="button" aria-pressed="false" aria-label="Pause or play" title="Play / Pause (Space)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><g class="pa"><path d="M8 5v14M16 5v14"/></g><path class="pl" d="M7 5l12 7-12 7z"/></svg>
  </button>
  <button class="tbtn" id="rstBtn" type="button" aria-label="Restart" title="Restart (R)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
  </button>
  <button class="tbtn" id="nextBtn" type="button" aria-label="Next simulation" title="Next (→)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <button class="tbtn" id="sndBtn" type="button" aria-pressed="true" aria-label="Toggle sound" title="Sound (M)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="off" d="M3 3l18 18"/></svg>
  </button>
  <button class="tbtn rec" id="recBarBtn" type="button" aria-pressed="false" aria-label="Record WebM" title="Record 60fps WebM Video">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor" stroke="none"/></svg>
  </button>
</div>

<div id="toast" aria-live="polite"></div>

<!-- Right Slide-Over Settings Drawer (Divider-Free) -->
<aside class="drawer" id="drawer" aria-label="Settings">
  <div class="dhead">
    <h3>Settings</h3>
    <button class="tbtn" id="drawerClose" type="button" aria-label="Close settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="dsec">
    <span class="dlab">Surface</span>
    <div class="chips" id="matGrid"></div>
  </div>

  <div class="dsec">
    <span class="dlab">Palette</span>
    <div class="palgrid" id="palGrid"></div>
  </div>

  <div class="dsec">
    <span class="dlab">Instrument</span>
    <div class="chips" id="timGrid"></div>
  </div>

  <div class="dsec">
    <span class="dlab">Melody</span>
    <div class="chips" id="melGrid"></div>
  </div>

  <div class="dsec">
    <span class="dlab">Physics &amp; display</span>
    <div class="sliders">
      <div class="srow"><label for="speed">Speed</label><output id="speedO"></output><input id="speed" type="range" min="0.25" max="2.4" step="0.05"></div>
      <div class="srow"><label for="grav">Gravity</label><output id="gravO"></output><input id="grav" type="range" min="0" max="2" step="0.05"></div>
      <div class="srow"><label for="bounce">Energy</label><output id="bounceO"></output><input id="bounce" type="range" min="0.90" max="1.05" step="0.005"></div>
      <div class="srow"><label for="trail">Trails</label><output id="trailO"></output><input id="trail" type="range" min="0" max="100" step="1"></div>
      <div class="srow"><label for="glow">Bloom</label><output id="glowO"></output><input id="glow" type="range" min="0" max="100" step="1"></div>
      <div class="srow"><label for="bright">Brightness</label><output id="brightO"></output><input id="bright" type="range" min="55" max="115" step="1"></div>
      <div class="srow"><label for="vol">Volume</label><output id="volO"></output><input id="vol" type="range" min="0" max="100" step="1"></div>
    </div>
  </div>

  <div class="dsec">
    <span class="dlab">Stage &amp; export</span>
    <div class="actgrid">
      <button class="actbtn" id="autoBtn" type="button" aria-pressed="false">Auto-Compile</button>
      <button class="actbtn" id="reelsBtn" type="button" aria-pressed="false">9:16 Stage</button>
      <button class="actbtn" id="surpBtn" type="button">Surprise Me</button>
      <button class="actbtn" id="pngBtn" type="button">Save PNG</button>
      <button class="actbtn danger" id="recDrawerBtn" type="button" aria-pressed="false">Record WebM</button>
      <button class="actbtn" id="fsBtn" type="button">Fullscreen</button>
      <button class="actbtn full" id="resetDefBtn" type="button">Reset to defaults</button>
    </div>
  </div>
</aside>

<!-- Categorized Live Preview Catalog -->
<div id="catalog" hidden role="dialog" aria-modal="true" aria-label="Simulation catalog">
  <div class="cat-wrap">
    <div class="cat-head">
      <div>
        <h2>Simulations</h2>
        <p id="catSub">35 interactive physics, escape challenge &amp; 3D wave simulations running live.</p>
      </div>
